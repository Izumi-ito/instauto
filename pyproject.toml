[project]
name = "instauto"
version = "0.1.0"
description = "Instagram multi-account automation using CloakBrowser"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cloakbrowser",
    "pyotp",
    "httpx[socks]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
